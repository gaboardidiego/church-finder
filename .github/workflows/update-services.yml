name: Update services

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region to update"
        type: choice
        options:
          - all
          - austria
          - europe
        default: all
        required: true
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: deploy-website-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  update-services:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install scraper dependencies
        run: uv sync --project scraper --locked --no-dev

      - name: Install Chromium
        if: github.event_name == 'schedule' || inputs.region == 'all' || inputs.region == 'austria'
        run: uv run --project scraper --locked --no-dev playwright install --with-deps chromium

      - name: Import services across Austria
        if: github.event_name == 'schedule' || inputs.region == 'all' || inputs.region == 'austria'
        run: uv run --project scraper --locked --no-dev churches-services --country austria --consent-google-maps --fresh

      - name: Import Ember services across Europe
        if: github.event_name == 'schedule' || inputs.region == 'all' || inputs.region == 'europe'
        run: uv run --project scraper --locked --no-dev churches-services --country europe --fresh

      - name: Update published database
        run: cp web/public/data/*.json docs/data/

      - name: Commit updated databases
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/public/data docs/data
          if git diff --cached --quiet; then
            echo "No database changes."
            exit 0
          fi
          git commit -m "Update services databases"
          git push origin "HEAD:$GITHUB_REF"
