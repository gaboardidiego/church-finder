<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Church Finder Austria – Church Services, Mass Times &amp; Liturgies</title>
    <meta
      name="description"
      content="Find church services across Austria by day, language and location, with times and map."
    />
    <meta
      name="keywords"
      content="Austria church services, Gottesdienste Österreich, mass times, English mass, church finder"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#1f3a5f" />
    <link rel="canonical" href="https://gaboardidiego.github.io/church-finder/" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%9D%3C/text%3E%3C/svg%3E"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Church Finder Austria" />
    <meta property="og:title" content="Church Finder Austria – Church Services &amp; Mass Times" />
    <meta
      property="og:description"
      content="Find church services across Austria by day, language and location."
    />
    <meta property="og:url" content="https://gaboardidiego.github.io/church-finder/" />
    <meta property="og:locale" content="en" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Church Finder Austria – Church Services &amp; Mass Times" />
    <meta
      name="twitter:description"
      content="Find church services across Austria by day, language and location."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Church Finder Austria",
        "url": "https://gaboardidiego.github.io/church-finder/",
        "inLanguage": "en",
        "description": "Find church services, mass times and liturgies across Austria by day, language and location.",
        "about": {
          "@type": "Country",
          "name": "Austria",
          "sameAs": "https://en.wikipedia.org/wiki/Austria"
        }
      }
    </script>
  </head>
  <body>
    <noscript
      >Church Finder Austria lists church services, mass times and liturgies across Austria. Please
      enable JavaScript to use it.</noscript
    >
    <div id="app">
      <p class="scope-alert" role="note" data-i18n="scopeAlert">
        Church-service listings from across Austria are shown.
      </p>
      <header class="topbar">
        <div class="topbar-heading">
          <h1><span class="logo">✝</span> Church Finder <small>Austria</small></h1>
          <label class="language-switcher">
            <span aria-hidden="true">🌐</span>
            <span class="sr-only" data-i18n="displayLanguage">Display language</span>
            <select
              id="ui-language"
              aria-label="Display language"
              data-i18n-aria-label="displayLanguage"
            >
              <option value="en">English</option>
              <option value="de">Deutsch</option>
              <option value="it">Italiano</option>
            </select>
          </label>
        </div>
        <div class="search">
          <input
            id="name-search"
            type="search"
            placeholder="Church name…"
            data-i18n-placeholder="churchName"
            autocomplete="off"
          />
          <button id="locate" type="button" data-i18n="useLocation">◎ Use my location</button>
        </div>
        <div class="filters">
          <div class="chips" id="day-chips">
            <button type="button" data-day="today" data-i18n="today">Today</button>
            <button type="button" data-day="tomorrow" data-i18n="tomorrow">Tomorrow</button>
            <button type="button" data-day="weekend" data-i18n="weekend">This weekend</button>
            <button type="button" data-day="any" data-i18n="anyDay">Any day</button>
          </div>
          <input id="date" type="date" aria-label="Day" data-i18n-aria-label="day" />
          <select
            id="language"
            aria-label="Service language"
            data-i18n-aria-label="serviceLanguage"
          ></select>
          <select
            id="denomination"
            aria-label="Denomination"
            data-i18n-aria-label="denomination"
          ></select>
        </div>
        <p id="status" role="status"></p>
        <p class="hint" data-i18n="hint">
          💡 Click anywhere on the map to drop a pin — churches are sorted by distance from it.
        </p>
      </header>
      <div class="view-toggle">
        <button type="button" data-view="list" data-i18n="list">List</button>
        <button type="button" data-view="map" class="active" data-i18n="map">Map</button>
      </div>
      <main class="layout" data-view="map">
        <section id="results" aria-label="Results" data-i18n-aria-label="results"></section>
        <section id="map" aria-label="Map" data-i18n-aria-label="mapLabel"></section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
